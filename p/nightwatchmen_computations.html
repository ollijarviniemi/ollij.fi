<script>
  /* the site's own theme rule (w-base.html), verbatim: its toggle's localStorage choice, else the
     OS scheme — set before paint, so the box and the post it becomes are the same paper */
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<style>
  /* the site's body face, same file as site.css → warm in cache before the post is written */
  @font-face{font-family:'Newsreader';font-style:normal;font-weight:300 800;font-display:swap;
             src:url("/fonts/newsreader-latin-var.woff2") format("woff2")}
  :root{--bg:#fbfaf6;--ink:#1b1a16;--accent:#7c2d2d;--border:#ded7c7}
  :root[data-theme="dark"]{--bg:#16150f;--ink:#e9e4d4;--accent:#d98c7a;--border:#34343a}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);display:grid;place-items:center;
       font:500 21px 'Newsreader',Garamond,Georgia,serif}
  form{display:flex}
  input{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--border);
        outline:none;padding:.15em .2em;width:17ch;text-align:center;letter-spacing:.02em;
        transition:border-color .15s,opacity .15s;border-radius:0}
  input:focus{border-bottom-color:var(--ink)}
  input:disabled{opacity:.45}
  input::placeholder{color:var(--ink);opacity:.4;letter-spacing:.04em}
  .err input:not(#u){border-bottom-color:var(--accent);animation:sh .3s}
  #u,#go{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const te = new TextEncoder();
// A friend link (32-hex fragment) opens the post with no prompt — don't flash the passphrase
// box for the moment the unlock takes; it comes back below if the token turns out bad.
if (/^[0-9a-f]{32}$/.test((location.hash || '').slice(1))) document.getElementById('f').style.visibility = 'hidden';
// document.open/write only REPLACES the page (and runs the written page's scripts —
// comment bootstrap, KaTeX, theme) once the stub has fully loaded; called earlier it either
// APPENDS into the stub (mid-parse) or silently skips the written scripts (during
// DOMContentLoaded). The passphrase path was saved only by PBKDF2's 600k-iteration latency
// landing its write after `load`; the fast HKDF friend path is not — so gate on readyState.
function render(html) {
  const w = () => { document.open(); document.write(html); document.close(); };
  if (document.readyState === 'complete') w();
  else addEventListener('load', w, { once: true });
}

// PBKDF2 passphrase path (AISI reviewers) — unchanged.
async function unlock(pw) {
  const km = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt: b64(D.salt), iterations: D.iter },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, key, b64(D.ct));
  return new TextDecoder().decode(pt);
}
// HKDF friend path (one shared link): matches protect.py encrypt_friend + comments.js token
// scheme — HKDF-SHA256(16 token bytes, salt, info='protect-read') → AES-256-GCM read key.
async function friendUnlock(tokenHex) {
  const ikm = Uint8Array.from(tokenHex.match(/../g).map(h => parseInt(h, 16)));
  const km = await crypto.subtle.importKey('raw', ikm, 'HKDF', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'HKDF', hash: 'SHA-256', salt: b64(F.salt), info: te.encode('protect-read') },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(F.iv) }, key, b64(F.ct));
  return new TextDecoder().decode(pt);
}
// The 32-hex fragment (fresh link) or a previously stored cmt_token (returning friend, whose
// fragment the comment layer already stripped). Rendering keeps the hash intact so the page's
// own w-base bootstrap then activates comments on the same token.
async function tryFriend() {
  if (!F.ct) return false;
  let tok = null;
  const h = (location.hash || '').slice(1);
  if (/^[0-9a-f]{32}$/.test(h)) tok = h;
  else { try { const s = localStorage.getItem('cmt_token'); if (/^[0-9a-f]{32}$/.test(s || '')) tok = s; } catch (e) {} }
  if (!tok) return false;
  try { render(await friendUnlock(tok)); return true; } catch (e) { return false; }
}

const form = document.getElementById('f'), field = document.getElementById('p');
let busy = false, typed = false;
async function attempt(pw) {
  pw = (pw || '').trim();
  if (!pw || busy) return;
  busy = true; field.disabled = true; form.classList.remove('err');
  try {
    const html = await unlock(pw);
    try {  // Chrome-family: store the shared passphrase without relying on save-prompt heuristics
      if (window.PasswordCredential) navigator.credentials.store(new PasswordCredential({ id: 'reader', password: pw }));
    } catch (e) {}
    render(html);
  } catch (e) {
    void form.offsetWidth; form.classList.add('err');
    field.disabled = false; field.select(); field.focus();
  }
  busy = false;
}
form.addEventListener('submit', e => { e.preventDefault(); attempt(field.value); });
field.addEventListener('keydown', () => { typed = true; });

(async () => {
  if (await tryFriend()) return;                       // shared link → post + comments, no prompt
  form.style.visibility = '';                          // not a (valid) friend link → the box after all
  const h = location.hash.slice(1);
  if (h && !/^[0-9a-f]{32}$/.test(h)) {                // #passphrase one-click (a 32-hex that reached here
    attempt(decodeURIComponent(h));                    // failed friend-unlock → show the box, never try it as a pass)
  } else if (!h) {
    // a password manager AUTOFILLS without keystrokes — unlock on its value so a saved
    // passphrase means the post just opens. Never fires once the user starts typing.
    const autofill = () => { if (!typed && !busy && field.value) attempt(field.value); };
    [300, 900, 1800].forEach(t => setTimeout(autofill, t));
    document.addEventListener('pointerdown', autofill, { once: true });
  }
})();
})();
</script>
